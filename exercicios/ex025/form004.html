<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Formulário </title>
</head>
<body>
    <h1> Exemplo de formulário </h1>
    <form action="cadastro.php" autocomplete="on">

        <fieldset>

            <legend> Dados Pessoais </legend>

            <p>
                <label for="inome"> Nome: </label>
                <input type="text" name="Nome" id="inome" minlength="5" maxlength="20" required>
            </p>
            <p>
                <label for="iemail"> E-mail: </label>
                <input type="email" name="email" id="iemail" autocomplete="email" required>
            </p>
            <p>
                <label for="itel"> Telefone: </label>
                <input type="tel" name="tel" id="itel"  required autocomplete="tel">
            </p>
        </fieldset>

        <fieldset>

            <legend> Dados Familiares </legend>

            <p>
                <label for="inomep"> Nome do pai: </label>
                <input type="text" name="Nome" id="inomep" minlength="5" maxlength="20" required>
            </p>
            <p>
                <label for="inomem"> Nome da mãe: </label>
                <input type="text" name="Nome" id="inomem" minlength="5" maxlength="20" required>
            </p>
           
            <p>
                <label for="itel"> Telefone 1: </label>
                <input type="tel" name="tel" id="itel" required autocomplete="tel" placeholder="(xx) xxxxx-xxxx">
            </p>

            <p>
                <label for="itel"> Telefone 2: </label>
                <input type="tel" name="tel" id="itel" required autocomplete="tel" placeholder="(xx) xxxxx-xxxx" minlength="11">
            </p>
        </fieldset>

    

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
