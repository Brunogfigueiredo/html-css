<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Formulário </title>
</head>
<body>
    <h1> Teste de formulário </h1>
    
    <form action="cadastro.php" method="post" autocomplete="on">
        <p> <label for="iusu">Usuário:</label> </p>
        <input type="text" name="usu" id="iusu" required size="11" placeholder="Nome do usuário" autocomplete="username">

        <p> <label for="isen">Senha:</label> </p>
        <input type="password" name="sen" id="isen" required minlength="8" maxlength="20" size="16" placeholder="Digite aqui a sua senha" autocomplete="current-password">

        <p> <input type="submit" value="Enviar">
        <input type="reset" value="Limpar"></p>
    


    </form>
</body>
</html>
