<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Exercícios com Tabelas</title>

    <style>
        body { font-family: Arial, Helvetica, sans-serif;}

        table { width: 500px; border-collapse: collapse; margin: auto;}

        caption { font-size: 1.3em; font-weight: bolder; padding: 10px;}

        th, td { border: 1px solid black; padding: 8px;}

        h1 { text-align: center;}

        tr.vermelho { background-color: red;}

        col.cnome { background-color: yellow;}

        .csexo { background-color: pink;}

        col.cgrupo { background-color: green;}

        
    </style>
</head>
<body>
