<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Tabelas </title>

    <style>
        table { 
            width: 400px;
            border-collapse: collapse;

        }

        td { 
            border: 1px solid black;
            padding: 8px;

        }

        .linha { background-color: yellow;}
        .dado { background-color: red;}

        tr { 
            background-color: grey;
        }


    </style>
</head>
<body>
    <h1> Minha Primeira Tabela</h1>
    <!-- 
    Hierarquia de TABELAS (simples)

    TABLE = tabela
        TABLE ROW - linha de tabela
            TABLE HEADER - cabeçalho de tabela
            TABLE DATA - dado da tabela
    
    -->

    <table>
        <tr class="linha">
            <td class="dado">A1</td>
            <td>B1</td>
            <td class="dado">C1</td>
        </tr>

        <tr>
            <td>A2</td>
            <td class="dado">B2</td>
            <td>C3</td>
        </tr>

        <tr>
            <td class="dado">A3</td>
            <td>B3</td>
            <td class="dado">C3</td>
        </tr>

        <tr>
            <td>A4</td>
            <td class="dado">B4</td>
            <td>C4</td>
        </tr>


    </table>


</body>
</html>
