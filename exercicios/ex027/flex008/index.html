<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> flexible Box </title>

    <style>
     div.conteiner {
        background-color: lightcoral;
        display: flex;
        flex-flow: row wrap;
        align-items: flex-start;

        height: 400px;
     }  
     
     div.item {
        background-color: lightseagreen;
        border: 1px solid black;
        text-align: center;

        flex: auto;
     }

     div#i1 {
      align-self: stretch;
     }

     div#i2 {
        align-self: flex-end;
     }

     div#i3 {
      align-self: center;
     }

     div#i4 {
      
     }

     div#i5 {
      align-self: stretch;
     }

     div#i6 {
      align-self: self-start;
     }

     div#i7 {
      align-self: center;
     }

     div#i8 {
      align-self: self-end;
     }

     div#i9 {
      align-self: stretch;
     }
    </style>
</head>
<body>

    <div class="conteiner">
        <div class="item" id="i1"> A </div>
        <div class="item" id="i2"> B </div>
        <div class="item" id="i3"> C </div>
        <div class="item" id="i4"> D </div>
        <div class="item" id="i5"> E </div>
        <div class="item" id="i6"> F </div>
        <div class="item" id="i7"> G </div>
        <div class="item" id="i8"> H </div>
        <div class="item" id="i9"> I </div>
    </div>
    
</body>
</html>
