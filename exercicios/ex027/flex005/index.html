<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Centralização com Flex Box </title>
    <style>
        body {
            background-color: lightcoral;
        }

        main {
            background-color: lightgreen;
            height: 90vh;
            width: 90vw;

            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
        }

        section {
            background-color: limegreen;
            height: 200px;
            width: 200px;

            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
        }

        h1 {
            background-color: blue;
            height: 100px;
            width: 100px;
            text-align: center;
        }
    </style>
</head>
<body>

    <main>

        <section>

            <h1> Login </h1>

        </section>

    </main>
    
</body>
</html>
